name: Bodhuno live guest E2E

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "tests/e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - ".github/workflows/bodhuno-e2e.yml"
      - "question-bank/catalog.json"
      - "question-bank/sets/**/*.json"
  pull_request:
    paths:
      - "index.html"
      - "tests/e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - ".github/workflows/bodhuno-e2e.yml"
      - "question-bank/catalog.json"
      - "question-bank/sets/**/*.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-guest-e2e:
    name: Live guest practice flows
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Resolve the correct deployment URL
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == "main" && -z "${GITHUB_HEAD_REF:-}" ]]; then
            base_url="https://bodhuno.pages.dev"
          else
            branch_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            slug="${branch_name//\//-}"
            slug="${slug:0:28}"
            base_url="https://${slug}.bodhuno.pages.dev"
          fi
          echo "BODHUNO_BASE_URL=$base_url" >> "$GITHUB_ENV"
          echo "Testing deployment: $base_url"
      - name: Wait for the target deployment question catalogue
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$BODHUNO_BASE_URL/question-bank/catalog.json" -o /tmp/bodhuno-catalog.json; then
              if node -e 'const fs = require("node:fs"); const c = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (c.format !== "bodhuno-question-catalog/v1" || !Array.isArray(c.sets) || c.sets.length === 0) process.exit(1);' /tmp/bodhuno-catalog.json; then
                echo "Question catalogue is live at $BODHUNO_BASE_URL"
                exit 0
              fi
            fi
            echo "Waiting for the latest Cloudflare Pages catalogue deployment (attempt $attempt/30)..."
            sleep 2
          done
          echo "The target deployment did not serve a valid question catalogue."
          exit 1
      - name: Run live guest E2E tests
        env:
          CI: "true"
        run: npm run test:e2e
