name: Bodhuno live guest E2E

on:
  push:
    paths:
      - "index.html"
      - "tests/e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - ".github/workflows/bodhuno-e2e.yml"
  pull_request:
    paths:
      - "index.html"
      - "tests/e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - ".github/workflows/bodhuno-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-guest-e2e:
    name: Live guest practice flows
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live guest E2E tests
        env:
          CI: "true"
          BODHUNO_BASE_URL: ${{ github.event_name == 'pull_request' && 'https://feature-dynamic-question-cat.bodhuno.pages.dev' || 'https://bodhuno.pages.dev' }}
        run: npm run test:e2e
